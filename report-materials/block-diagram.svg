<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
  <title>Baseline model pipeline (no RAG)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#ffffff"/>

  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Baseline model pipeline (no RAG)</text>

  <rect x="40" y="55" width="160" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Evaluation question set</text>
  <text x="120" y="101" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Dune-domain queries</text>
  <line x1="200" y1="91" x2="248" y2="91" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="224" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">query</text>

  <rect x="252" y="50" width="176" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Qwen 2.5 7B Instruct</text>
  <text x="340" y="87" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Instruction-tuned LLM</text>
  <text x="340" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Parametric knowledge only</text>
  <text x="340" y="119" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">4-bit parameterization</text>
  <line x1="428" y1="91" x2="476" y2="91" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="452" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">answer</text>

  <rect x="480" y="55" width="160" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="81" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Generated answer</text>
  <text x="560" y="101" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Model response text</text>

  <rect x="238" y="158" width="204" height="22" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="173" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">No retrieval · no external context</text>

  <rect x="40" y="215" width="160" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="120" y="241" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Ground truth</text>
  <text x="120" y="261" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Hand-annotated answers</text>
  <line x1="200" y1="251" x2="248" y2="251" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="560" y1="127" x2="560" y2="215" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="560" y1="215" x2="428" y2="251" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="252" y="215" width="176" height="82" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="233" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Evaluation module</text>
  <text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">ROUGE-L</text>
  <text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">BERTScore</text>
  <line x1="428" y1="256" x2="476" y2="256" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="480" y="215" width="160" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="241" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Baseline scores</text>
  <text x="560" y="261" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Benchmark for RAG</text>

  <rect x="40" y="325" width="600" height="66" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="60" y="344" font-family="sans-serif" font-size="12" fill="#888780">Legend</text>
  <rect x="60" y="354" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="82" y="366" font-family="sans-serif" font-size="12" fill="#5F5E5A">Input / reference</text>
  <rect x="210" y="354" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="232" y="366" font-family="sans-serif" font-size="12" fill="#534AB7">Language model</text>
  <rect x="380" y="354" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="402" y="366" font-family="sans-serif" font-size="12" fill="#0F6E56">Output</text>
  <rect x="480" y="354" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="502" y="366" font-family="sans-serif" font-size="12" fill="#854F0B">Evaluation</text>
